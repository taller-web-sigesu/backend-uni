name: staging-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Health, login y estado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://uniservice-backend-staging.onrender.com
    steps:
      - name: Health
        run: |
          code=$(curl --silent --show-error --output /tmp/health.json --write-out "%{http_code}" "$BASE_URL/actuator/health")
          test "$code" = "200"
          grep -q '"status":"UP"' /tmp/health.json

      - name: Login
        env:
          STAGING_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          if [ -z "$STAGING_EMAIL" ] || [ -z "$STAGING_PASSWORD" ]; then
            echo "Faltan los secretos STAGING_ADMIN_EMAIL y STAGING_ADMIN_PASSWORD."
            exit 1
          fi
          code=$(curl --silent --show-error --output /tmp/login.json --write-out "%{http_code}" \
            -X POST "$BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "{\"correo\":\"$STAGING_EMAIL\",\"contrasena\":\"$STAGING_PASSWORD\"}")
          test "$code" = "200"
          grep -q '"tokenAcceso"' /tmp/login.json

      - name: Flujo real de solicitud
        env:
          STAGING_STUDENT_EMAIL: ${{ secrets.STAGING_STUDENT_EMAIL }}
          STAGING_STUDENT_PASSWORD: ${{ secrets.STAGING_STUDENT_PASSWORD }}
          STAGING_SUPERVISOR_EMAIL: ${{ secrets.STAGING_SUPERVISOR_EMAIL }}
          STAGING_SUPERVISOR_PASSWORD: ${{ secrets.STAGING_SUPERVISOR_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_STUDENT_EMAIL" ] || [ -z "$STAGING_STUDENT_PASSWORD" ]; then
            echo "Faltan los secretos de la cuenta estudiante de staging."
            exit 1
          fi
          if [ -z "$STAGING_SUPERVISOR_EMAIL" ] || [ -z "$STAGING_SUPERVISOR_PASSWORD" ]; then
            echo "Faltan los secretos de la cuenta supervisora de staging."
            exit 1
          fi

          login() {
            curl --silent --show-error \
              -X POST "$BASE_URL/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              --data "{\"correo\":\"$1\",\"contrasena\":\"$2\"}"
          }

          echo "Paso: login estudiante"
          STUDENT_LOGIN=$(login "$STAGING_STUDENT_EMAIL" "$STAGING_STUDENT_PASSWORD")
          STUDENT_TOKEN=$(echo "$STUDENT_LOGIN" | jq -r '.tokenAcceso')
          test -n "$STUDENT_TOKEN"
          test "$STUDENT_TOKEN" != "null"

          echo "Paso: login supervisor"
          SUPERVISOR_LOGIN=$(login "$STAGING_SUPERVISOR_EMAIL" "$STAGING_SUPERVISOR_PASSWORD")
          SUPERVISOR_TOKEN=$(echo "$SUPERVISOR_LOGIN" | jq -r '.tokenAcceso')
          SUPERVISOR_AREA=$(echo "$SUPERVISOR_LOGIN" | jq -r '.usuario.areaId')
          test -n "$SUPERVISOR_TOKEN"
          test "$SUPERVISOR_TOKEN" != "null"
          test -n "$SUPERVISOR_AREA"
          test "$SUPERVISOR_AREA" != "null"

          echo "Paso: categoria del area del supervisor ($SUPERVISOR_AREA)"
          CATEGORY_ID=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $STUDENT_TOKEN" \
            "$BASE_URL/api/v1/catalogs/categories" \
            | jq -r --arg area "$SUPERVISOR_AREA" '[.items[] | select(.areaId == $area)][0].id')
          test -n "$CATEGORY_ID"
          test "$CATEGORY_ID" != "null"

          echo "Paso: crear solicitud"
          STAMP=$(date +%Y%m%d%H%M%S)
          CREATE_CODE=$(curl --silent --show-error --output /tmp/created.json --write-out "%{http_code}" \
            -X POST "$BASE_URL/api/v1/requests" \
            -H "Authorization: Bearer $STUDENT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"categoriaId\":\"$CATEGORY_ID\",\"ubicacion\":\"Smoke CI $STAMP\",\"descripcion\":\"Solicitud creada por el smoke automatico $STAMP.\"}")
          test "$CREATE_CODE" = "201"
          REQUEST_ID=$(jq -r '.id' /tmp/created.json)
          REQUEST_CODE=$(jq -r '.codigo' /tmp/created.json)
          test -n "$REQUEST_ID"
          test "$REQUEST_ID" != "null"

          echo "Paso: leer solicitud $REQUEST_CODE"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $STUDENT_TOKEN" \
            "$BASE_URL/api/v1/requests/$REQUEST_ID" \
            | jq -e --arg id "$REQUEST_ID" '.id == $id' > /dev/null

          echo "Paso: supervisor ve la solicitud $REQUEST_CODE"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPERVISOR_TOKEN" \
            "$BASE_URL/api/v1/requests?size=100" \
            | jq -e --arg codigo "$REQUEST_CODE" '.items | any(.codigo == $codigo)' > /dev/null

      - name: Estado de la API
        run: |
          curl --fail --silent --show-error "$BASE_URL/api/v1/status" | grep -q '"status":"UP"'

      - name: Resumen
        run: |
          echo "Smoke staging OK: health, login y estado." >> "$GITHUB_STEP_SUMMARY"
