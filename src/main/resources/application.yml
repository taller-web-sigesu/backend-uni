spring:
  application:
    name: backend-uni
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/uni_services?allowPublicKeyRetrieval=true&sslMode=DISABLED}
    username: ${SPRING_DATASOURCE_USERNAME:uni_app}
    password: ${SPRING_DATASOURCE_PASSWORD:uni_local_app_2026}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
