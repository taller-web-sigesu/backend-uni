openapi: 3.1.0
info:
  title: API de Servicios Universitarios (Gestal)
  description: |-
    Contrato REST de HU-01 a HU-25. Identificadores como cadenas decimales, instantes en UTC,
    fechas y horas de reserva en America/Lima, paginación desde 0 (20 por defecto, 100 como máximo)
    y errores application/problem+json con codigo y correlationId.
  version: v1
servers:
- url: /
  description: Origen actual
security:
- bearerAuth: []
tags:
- name: Reserva de ambientes
  description: HU-21 a HU-25
- name: "SLA, auditoría y satisfacción"
  description: HU-18 a HU-20
- name: Catálogos
  description: HU-03
- name: Acceso y sesión
  description: HU-01 y HU-02
- name: Evidencias
  description: HU-26
- name: Administración de catálogos
  description: HU-16 y HU-17
- name: Dashboard y reportes
  description: HU-12 a HU-14
- name: Solicitudes
  description: "HU-03 a HU-06, HU-19 y HU-20"
- name: Administración de ambientes
  description: HU-25
- name: Usuarios y roles
  description: "HU-15, HU-28 y HU-29"
- name: "Asignación, prioridad y ciclo de vida"
  description: HU-07 a HU-11
paths:
  /api/v1/admin/spaces/{id}/schedule:
    get:
      tags:
      - Administración de ambientes
      summary: Consulta el horario semanal del ambiente
      operationId: schedule
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SpaceScheduleResponse"
    put:
      tags:
      - Administración de ambientes
      summary: Sustituye el horario semanal completo
      operationId: replaceSchedule
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSpaceScheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SpaceScheduleResponse"
  /api/v1/admin/reservation-policy:
    get:
      tags:
      - Administración de ambientes
      summary: Consulta la política vigente de reservas
      operationId: policy
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationPolicyResponse"
    put:
      tags:
      - Administración de ambientes
      summary: Sustituye la política vigente para nuevas reservas
      operationId: replacePolicy
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationPolicyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationPolicyResponse"
  /api/v1/reservations:
    get:
      tags:
      - Reserva de ambientes
      summary: Lista reservas propias o la bandeja de aprobación (vista=gestion)
      operationId: list
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: vista
        in: query
        required: false
        schema:
          type: string
      - name: estado
        in: query
        required: false
        schema:
          type: string
      - name: fechaDesde
        in: query
        required: false
        schema:
          type: string
      - name: fechaHasta
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseReservationSummaryResponse"
    post:
      tags:
      - Reserva de ambientes
      summary: Registra una reserva pendiente de aprobación
      operationId: create
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationSummaryResponse"
  /api/v1/requests:
    get:
      tags:
      - Solicitudes
      summary: Lista solicitudes visibles según el rol
      operationId: list_1
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: estado
        in: query
        required: false
        schema:
          type: string
      - name: categoriaId
        in: query
        required: false
        schema:
          type: string
      - name: prioridadId
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseRequestSummaryResponse"
    post:
      tags:
      - Solicitudes
      summary: Registra una solicitud de servicio
      operationId: create_1
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RequestSummaryResponse"
  /api/v1/requests/{id}/survey:
    post:
      tags:
      - Solicitudes
      summary: Registra la satisfacción del solicitante
      operationId: survey
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSurveyRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SurveyResponse"
  /api/v1/requests/{id}/comments:
    get:
      tags:
      - Solicitudes
      summary: Consulta los comentarios de seguimiento
      operationId: listComments
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseCommentResponse"
    post:
      tags:
      - Solicitudes
      summary: Agrega un comentario de seguimiento
      operationId: addComment
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentResponse"
  /api/v1/requests/{id}/attachments:
    get:
      tags:
      - Evidencias
      summary: Lista las evidencias vigentes de la solicitud
      operationId: list_2
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttachmentResponse"
    post:
      tags:
      - Evidencias
      summary: "Adjunta una evidencia JPG, PNG o PDF de hasta 5 MB (máximo 5 vigentes)"
      operationId: upload
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AuthenticatedActor"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
  /api/v1/requests/{id}/assignments:
    post:
      tags:
      - "Asignación, prioridad y ciclo de vida"
      summary: Asigna o reasigna la solicitud
      operationId: assign
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTechnicianRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
  /api/v1/auth/register:
    post:
      tags:
      - Acceso y sesión
      summary: Registra una cuenta de estudiante pendiente de aprobación (HU-27)
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Acceso y sesión
      summary: Rota el refresh y emite un JWT nuevo
      operationId: refresh
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Acceso y sesión
      summary: Revoca la sesión actual
      operationId: logout
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - Acceso y sesión
      summary: Inicia sesión con la cuenta institucional
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/admin/users:
    get:
      tags:
      - Usuarios y roles
      summary: Lista cuentas
      operationId: list_3
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
    post:
      tags:
      - Usuarios y roles
      summary: Crea una cuenta institucional con cambio de contraseña obligatorio
      operationId: create_2
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/admin/users/{id}/password-reset:
    post:
      tags:
      - Usuarios y roles
      summary: "Genera una contraseña temporal, revoca las sesiones y exige cambiarla\
        \ (HU-29)"
      operationId: resetPassword
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
  /api/v1/admin/spaces:
    get:
      tags:
      - Administración de ambientes
      summary: Lista espacios activos e inactivos
      operationId: listSpaces
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSpaceResponse"
    post:
      tags:
      - Administración de ambientes
      summary: Crea un ambiente
      operationId: createSpace
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SpaceResponse"
  /api/v1/admin/space-types:
    get:
      tags:
      - Administración de ambientes
      summary: Lista tipos de ambiente
      operationId: listTypes
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSpaceTypeResponse"
    post:
      tags:
      - Administración de ambientes
      summary: Crea un tipo de ambiente
      operationId: createType
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceTypeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SpaceTypeResponse"
  /api/v1/admin/sla-policies:
    get:
      tags:
      - "SLA, auditoría y satisfacción"
      summary: Consulta las políticas de SLA
      operationId: list_4
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSlaPolicyResponse"
    post:
      tags:
      - "SLA, auditoría y satisfacción"
      summary: Define una política para solicitudes nuevas
      operationId: create_3
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSlaPolicyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SlaPolicyResponse"
  /api/v1/admin/catalogs/priorities:
    get:
      tags:
      - Administración de catálogos
      summary: Lista prioridades activas e inactivas
      operationId: list_5
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponsePriorityResponse"
    post:
      tags:
      - Administración de catálogos
      summary: Crea una prioridad
      operationId: create_4
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriorityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PriorityResponse"
  /api/v1/admin/catalogs/categories:
    get:
      tags:
      - Administración de catálogos
      summary: Lista categorías activas e inactivas
      operationId: list_6
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseCategoryResponse"
    post:
      tags:
      - Administración de catálogos
      summary: Crea una categoría
      operationId: create_5
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /api/v1/admin/catalogs/areas:
    get:
      tags:
      - Administración de catálogos
      summary: Lista áreas activas e inactivas
      operationId: list_7
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAreaResponse"
    post:
      tags:
      - Administración de catálogos
      summary: Crea un área
      operationId: create_6
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAreaRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AreaResponse"
  /api/v1/reservations/{id}/status:
    patch:
      tags:
      - Reserva de ambientes
      summary: "Confirma, rechaza o cancela una reserva"
      operationId: changeStatus
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeReservationStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDetailResponse"
  /api/v1/requests/{id}:
    get:
      tags:
      - Solicitudes
      summary: Consulta el detalle y el SLA de una solicitud
      operationId: detail
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RequestDetailResponse"
    patch:
      tags:
      - "Asignación, prioridad y ciclo de vida"
      summary: Actualiza la prioridad de una solicitud abierta
      operationId: changePriority
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePriorityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RequestSummaryResponse"
  /api/v1/requests/{id}/status:
    patch:
      tags:
      - "Asignación, prioridad y ciclo de vida"
      summary: Cambia el estado según la transición autorizada
      operationId: changeStatus_1
      parameters:
      - name: actor
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/AuthenticatedActor"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequestStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
