components:
  schemas:
    AuthenticatedActor:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - ESTUDIANTE
          - DOCENTE
          - TECNICO
          - SUPERVISOR
          - ADMINISTRADOR
        areaId:
          type: integer
          format: int64
        nombreCompleto:
          type: string
        mustChangePassword:
          type: boolean
    ReplaceSpaceScheduleRequest:
      type: object
      properties:
        franjas:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlotRequest"
      required:
      - franjas
    ScheduleSlotRequest:
      type: object
      properties:
        diaSemana:
          type: integer
          format: int32
          maximum: 7
          minimum: 1
        horaApertura:
          type: string
          format: time-local
        horaCierre:
          type: string
          format: time-local
      required:
      - diaSemana
      - horaApertura
      - horaCierre
    ScheduleSlotResponse:
      type: object
      properties:
        diaSemana:
          type: integer
          format: int32
        horaApertura:
          type: string
        horaCierre:
          type: string
    SpaceScheduleResponse:
      type: object
      properties:
        franjas:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlotResponse"
    ReservationPolicyRequest:
      type: object
      properties:
        duracionMinimaMinutos:
          type: integer
          format: int32
          maximum: 65535
          minimum: 1
        duracionMaximaMinutos:
          type: integer
          format: int32
          maximum: 65535
          minimum: 1
        horasAnticipacionMinima:
          type: integer
          format: int32
          maximum: 65535
          minimum: 0
        diasAnticipacionMaxima:
          type: integer
          format: int32
          maximum: 65535
          minimum: 0
        maxReservasActivasPorDia:
          type: integer
          format: int32
          maximum: 255
          minimum: 1
      required:
      - diasAnticipacionMaxima
      - duracionMaximaMinutos
      - duracionMinimaMinutos
      - horasAnticipacionMinima
      - maxReservasActivasPorDia
    ReservationPolicyResponse:
      type: object
      properties:
        duracionMinimaMinutos:
          type: integer
          format: int32
        duracionMaximaMinutos:
          type: integer
          format: int32
        horasAnticipacionMinima:
          type: integer
          format: int32
        diasAnticipacionMaxima:
          type: integer
          format: int32
        maxReservasActivasPorDia:
          type: integer
          format: int32
    CreateReservationRequest:
      type: object
      properties:
        espacioId:
          type: string
          minLength: 1
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
          format: time-local
        horaFin:
          type: string
          format: time-local
        motivo:
          type: string
          maxLength: 255
          minLength: 0
        numAsistentes:
          type: integer
          format: int32
          exclusiveMinimum: 0
          maximum: 65535
      required:
      - espacioId
      - fecha
      - horaFin
      - horaInicio
      - motivo
    ReservationSummaryResponse:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
        espacioId:
          type: string
        espacio:
          type: string
        fecha:
          type: string
        horaInicio:
          type: string
        horaFin:
          type: string
        estado:
          type: string
        estadoOperativo:
          type: string
    CreateRequestRequest:
      type: object
      properties:
        categoriaId:
          type: string
          minLength: 1
        ubicacion:
          type: string
          maxLength: 255
          minLength: 0
        descripcion:
          type: string
          maxLength: 5000
          minLength: 0
      required:
      - categoriaId
      - descripcion
      - ubicacion
    PersonResponse:
      type: object
      properties:
        id:
          type: string
        nombreCompleto:
          type: string
    RequestSummaryResponse:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
        categoriaId:
          type: string
        areaId:
          type: string
        prioridadId:
          type: string
        estado:
          type: string
        creadoEn:
          type: string
        responsableActual:
          $ref: "#/components/schemas/PersonResponse"
    SubmitSurveyRequest:
      type: object
      properties:
        calificacion:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        comentario:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - calificacion
    SurveyResponse:
      type: object
      properties:
        id:
          type: string
        solicitudId:
          type: string
        calificacion:
          type: integer
          format: int32
        comentario:
          type: string
    CreateCommentRequest:
      type: object
      properties:
        contenido:
          type: string
          maxLength: 5000
          minLength: 0
      required:
      - contenido
    CommentResponse:
      type: object
      properties:
        id:
          type: string
        contenido:
          type: string
